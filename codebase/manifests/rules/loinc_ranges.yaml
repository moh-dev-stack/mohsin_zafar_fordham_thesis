    source: "clinical reference: arterial oxygen content peaks near 25 mL/dL"

  - loinc: "7"
    display: "eICU labtypeid 7, tidal volume"
    unit: "mls"
    unit_aliases: ["mL"]
    physiological_min: 0.0
    physiological_max: 3000.0
    source: "clinical reference (general clinical knowledge): ventilator tidal volumes are 200-1000 mL; 3000 is three times the top of that band. The previous 5000 had no stated derivation"

# ======================================================================
# KNOWN-CORRUPT REAL RECORDS
#
# The one place in this file where a real cohort value may be named. These are
# records that a truthful bound above correctly flags, but that are present in
# the shipped cohorts and would otherwise make the false-positive guard in
# tests/test_ranges.py fail. Listing a record here is an admission that the
# RECORD is wrong, not a concession that the BOUND is.
#
# Rules for this list, enforced by tests/test_ranges.py:
#   * every entry must name cohort, code, unit, value, count and why;
#   * every entry must actually occur in the cohort with exactly that count, so
#     the list cannot rot or be padded with speculative exemptions;
#   * every entry must actually be flagged by the bounds above, so an entry
#     cannot outlive the bound that needed it;
#   * nothing outside this list may be flagged; a new real false positive fails
#     the suite rather than being silenced by widening a bound.
#
# `dqa.ranges.load_ranges` reads only the `ranges` key and ignores this one, so
# the checker's behaviour is unaffected: it flags these records at run time,
# which is the correct verdict. What the list changes is only whether the test
# suite treats that verdict as a defect in the rule file.
# ======================================================================

known_corrupt_values:

  - cohort: "eicu-demo"
    code: "7"
    unit: "%"
    display: "FiO2"
    value: 4000.0
    count: 1
    why: >-
      FiO2 is the fraction of inspired oxygen, reported here as a percentage. It
      cannot exceed 100 by definition, and 100% oxygen is the ceiling of any
      delivery device at atmospheric pressure. 4000 is the same reading with a
      misplaced scale factor. Flagging it is correct behaviour, not a false
      positive; the rule for 7|% is definitional at 100 and stays there.

  - cohort: "eicu-demo"
    code: "7"
    unit: "%"
    display: "FiO2"
    value: 10000.0
    count: 2
    why: >-
      Same defect as the 4000 row and the reason the previous revision of this
      file carried a bound of 10000 for the whole fraction group. Two records
      set the ceiling for 41 observations of FiO2, oxygen saturation and the
      haemoglobin fractions, and in doing so removed the group's ability to
      reject anything at all below 10000. The bound is now 100 and these two
      rows are named here instead.

  - cohort: "eicu-demo"
    code: "7"
    unit: "&#176;C"
    display: "Temperature"
    value: 99.8
    count: 1
    why: >-
      A body temperature of 99.8 recorded in degrees Celsius. 99.8 degF is
      37.7 degC, an ordinary low-grade fever, so this is a Fahrenheit reading
      carrying a Celsius unit rather than an impossible patient. The other two
      temperature rows under this code (37.0 and 37.2) are Celsius and pass.
      The range check is the wrong instrument for a unit defect, which is what
      dqa.ranges.unit_verdict exists for; until that is wired in, the record is
      named here rather than legislated for by a bound of 120 degC.
