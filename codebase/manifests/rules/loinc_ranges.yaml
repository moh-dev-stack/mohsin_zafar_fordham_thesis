# Per-analyte physiological range rules.
#
# WHY THIS FILE EXISTS
# --------------------
# The Baseline judges plausibility with a single numeric envelope
# of [-1000, 100000] applied to every analyte, while the multi-agent system
# judges plausibility with no reference ranges at all (no cohort Observation
# carries `referenceRange`). The two systems therefore differ in *checking
# logic* as well as in *privilege*, which confounds the experiment. This file is
# the shared clinical knowledge both systems can be given, so that the only
# remaining difference between them is how much of the record they may see.
#
# WHAT A BOUND MEANS HERE
# -----------------------
# `physiological_min` / `physiological_max` are SURVIVABILITY / CREDIBILITY
# limits, not normal reference intervals. A potassium of 6.5 mmol/L is grossly
# abnormal but entirely survivable and MUST NOT be flagged; a potassium of 9999
# mmol/L is not a measurement. Bounds are deliberately set outside the widest
# value compatible with a living patient, including paediatric and critical-care
# extremes, so that a `fail` verdict means "this cannot be a real measurement"
# rather than "this patient is unwell".
#
# COMPARISON IS INCLUSIVE: a value fails only when
#   value < physiological_min  or  value > physiological_max.
# Every bound whose floor is 0.0 therefore admits a genuine zero (0% eosinophils,
# a pain score of 0, a LogMAR of 0.0) while rejecting the injected -1.0.
#
# KEYING, AND WHY SOME ENTRIES SHARE A `loinc`
# --------------------------------------------
# Entries are keyed by the Observation code string exactly as it appears in the
# data. Two of the three cohorts do not actually use LOINC:
#   * MIMIC-IV emits d_labitems itemids (50971, 51221, ...);
#   * eICU emits labtypeid integers (1, 2, 3, 4, 7) that aggregate dozens of
#     unrelated analytes under one code.
# Both nevertheless declare system=http://loinc.org. For the eICU aggregate
# codes a single bound would have to span creatinine (0.6 mg/dL) and CPK
# (1282 U/L), which would be useless, so those codes carry several entries
# distinguished by `unit`. The loader registers each entry under "<code>|<unit>"
# and additionally registers one entry per code under the bare "<code>" as the
# fallback used when the Observation carries no unit.
#
# `unit_aliases` lists other spellings of the SAME quantity seen in the cohorts
# (e.g. "pH" and "[pH]"); they resolve to the same rule and are accepted by
# unit_verdict. A different quantity always gets its own entry.
#
# A BOUND IS NOT AN ALLOWLIST: THE TWO MECHANISMS IN THIS FILE
# ------------------------------------------------------------
# An earlier revision of this file widened bounds until zero real cohort values
# failed the guard in tests/test_ranges.py. That is a fitting procedure, not a
# test: it let a handful of corrupt real records rewrite the physiology, and it
# constrained the DATA instead of the CODE. Two separate mechanisms now do the
# two separate jobs:
#
#   1. `physiological_min` / `physiological_max` state what is SURVIVABLE. They
#      are set from clinical or definitional reasoning and are never moved to
#      accommodate a record. Where the reasoning is general clinical knowledge
#      rather than a cited figure, the `source` field says so in those words.
#
#   2. `known_corrupt_values` (top level, below `ranges`) names each real cohort
#      record that a truthful bound flags, with its cohort, code, unit, value,
#      count and the reason it cannot be a measurement. The false-positive guard
#      permits exactly these and nothing else, so a NEW real false positive
#      fails the suite loudly instead of being silenced by widening a bound.
#      `dqa.ranges` never reads this key; it is documentation plus test input.
#
# The two records that forced the original widening are now allowlisted rather
# than legislated for: eICU FiO2 of 4000 and 10000 (a percentage cannot exceed
# 100), and an eICU body temperature of 99.8 labelled degC (Fahrenheit).
#
# DECLARED EXCEPTIONS: BOUNDS WIDER THAN THE [0, 9000] FALLBACK
# ------------------------------------------------------------
# A per-analyte bound wider than the fallback envelope buys nothing against a
# crude injected constant and costs detection, so each of the 23 that remain is
# a deliberate claim that the analyte really does reach that far, not an
# accommodation of any record. None of them was forced by cohort data: every one
# sits far above its group's observed maximum, so each could be narrowed to the
# fallback tomorrow without a single false positive, and is not, because that
# would be a lie:
#   * creatine kinase (2157-6, 50910) and the eICU enzyme-activity aggregate
#     (code 1, Units/L, which pools CPK with the transaminases) -- CK in massive
#     rhabdomyolysis is measured in the hundreds of thousands of U/L;
#   * ALT and AST (1742-6, 50861, 1920-8, 50878) -- fulminant hepatic necrosis
#     and ischaemic hepatitis produce transaminases above 10,000 U/L, so a value
#     of 9999 U/L is a credible measurement and is correctly NOT flagged;
#   * LDH (14804-9, 50954), amylase (50867) and lipase (50956) -- massive
#     haemolysis, tumour lysis and severe pancreatitis all read out above
#     10,000 U/L;
#   * triglycerides (2571-8, 51000) -- familial chylomicronaemia above 10,000
#     mg/dL is documented;
#   * ferritin (2276-4) -- haemophagocytic lymphohistiocytosis exceeds 50,000;
#   * alpha-fetoprotein (50864) and hs-troponin (89579-7) -- tumour and necrosis
#     markers with no short-term physiological ceiling;
#   * NT-proBNP (33762-6, 71425-3) -- the assay measuring range itself reaches
#     35,000 pg/mL;
#   * urine volume (51108, 51109) -- untreated diabetes insipidus produces 20 L
#     in a day, so a 24-hour collection of 10 L is real;
#   * albumin/creatinine ratio (14959-1) -- nephrotic-range ratios exceed
#     10,000 mg/g;
#   * annual family income (63586-2) -- a currency amount, not a measurement;
#   * the eICU code 4 unit-less rows -- septic synovial fluid white cell counts.
# Consequence, stated plainly because it is the file's main limitation: for
# these analytes an injected 9999 is indistinguishable from a real measurement,
# and no honest value-only bound can change that. Catching it needs either a
# unit-aware check, disaggregated codes, or an injector that derives its values
# from these bounds rather than from a fixed constant.
#
# A THIRD KIND OF ARTEFACT THIS FILE CANNOT REPAIR
# ------------------------------------------------
# Synthea emits platelet distribution width (32207-3) on a 150-520 fL scale.
# Real PDW is roughly 8-25 fL, so the entire 304-value series is wrong by a
# scale factor. That is neither a true bound nor a handful of corrupt records,
# so neither mechanism above fits it: an allowlist of 304 entries would not be
# an allowlist. The bound is left wide and the `source` field says plainly that
# it encodes a generator artefact. Flagged here for a human to decide.
#
# Every bound in this file was checked against the observed extrema recorded in
# results/loinc_survey.json. Observed extrema are used to check that a bound is
# not accidentally too tight; they are never used to set one.

version: 1

ranges:

  # ------------------------------------------------------------------
  # Fallback for any code not enumerated below.
  #
  # Empirically grounded: across all 70,899 Observations in the three cohorts,
  # the only top-level numeric values that are negative or exceed 9000 belong to
  # codes explicitly enumerated in this file (base excess, DXA T-score, eICU
  # FiO2). Anything else falling outside [0, 9000] in these unit conventions is
  # not a measurement. Conservative in the sense that it is far wider than any
  # single analyte's own bound; it is a backstop, not a substitute for a rule.
  # ------------------------------------------------------------------
  - loinc: "default"
    display: "Fallback envelope for un-enumerated codes"
    unit: null
    physiological_min: 0.0
    physiological_max: 9000.0
    source: "survey-derived backstop (results/loinc_survey.json); no enumerated-code exception applies"

