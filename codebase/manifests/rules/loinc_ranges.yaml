  # ==================================================================
  # eICU AGGREGATE CODES (labtypeid integers, NOT LOINC)
  #
  # One code covers dozens of analytes, so each code is split by unit. The
  # bare-code entry (unit: null) covers the eICU rows that carry no unit at all.
  # Bounds here are the widest survivable value across every analyte reported
  # under that code and unit, which is looser than a per-analyte rule but still
  # very much tighter than the [-1000, 100000] envelope it replaces.
  # ==================================================================

  # --- eICU code 1: general chemistry ---
  - loinc: "1"
    display: "eICU labtypeid 1, unit-less (anion gap)"
    unit: null
    physiological_min: -20.0
    physiological_max: 100.0
    source: "clinical reference (general clinical knowledge): the unit-less eICU chemistry rows are anion gap, which is a difference between bounded electrolytes; negative gaps are documented in bromide toxicity and paraproteinaemia, and 100 is the same ceiling the dedicated anion gap rule 50868 carries. The previous 200 was twice that with no stated reason"

  - loinc: "1"
    display: "eICU labtypeid 1, mass concentration (creatinine, BUN, glucose, calcium, bilirubin, phosphate, lipids)"
    unit: "mg/dL"
    physiological_min: 0.0
    physiological_max: 3000.0
    source: "clinical reference: widest survivable value across the mg/dL analytes reported under this code (glucose)"

  - loinc: "1"
    display: "eICU labtypeid 1, molar concentration (sodium, potassium, chloride, bicarbonate, lactate)"
    unit: "mmol/L"
    unit_aliases: ["mEq/L"]
    physiological_min: 0.0
    physiological_max: 250.0
    source: "clinical reference (general clinical knowledge): the widest member of this group is sodium, survivable to about 190 mmol/L; chloride reaches 180, bicarbonate 50, potassium 12, lactate 40. 250 covers the widest with a margin. The previous 500 was more than twice any member"

  - loinc: "1"
    display: "eICU labtypeid 1, enzyme activity (ALT, AST, alkaline phosphatase, CPK, lipase, amylase)"
    unit: "Units/L"
    unit_aliases: ["U/L", "IU/L"]
    physiological_min: 0.0
    physiological_max: 500000.0
    source: "clinical reference (general clinical knowledge): CPK in massive rhabdomyolysis reaches the hundreds of thousands of U/L and is genuinely reported under this code and unit, so it sets the ceiling for the whole group. DECLARED EXCEPTION, not an accommodation: the bound is wide because one aggregate code pools analytes whose plausible ranges differ by three orders of magnitude, and no value-only rule keyed on (code, unit) can do better. Disaggregating the eICU labtypeid is the fix; widening or narrowing this number is not"

  - loinc: "1"
    display: "eICU labtypeid 1, protein concentration (albumin, total protein)"
    unit: "g/dL"
    physiological_min: 0.0
    physiological_max: 30.0
    source: "clinical reference: bounded by the total protein ceiling"

  - loinc: "1"
    display: "eICU labtypeid 1, immunoassay (troponin I, troponin T, CK-MB)"
    unit: "ng/mL"
    physiological_min: 0.0
    physiological_max: 2000.0
    source: "clinical reference: conventional troponin and CK-MB immunoassays report out below 1000 ng/mL"

  - loinc: "1"
    display: "eICU labtypeid 1, fraction (CK-MB index)"
    unit: "%"
    physiological_min: 0.0
    physiological_max: 100.0
    source: "definitional: a percentage of total CK"

  # --- eICU code 2: toxicology and drug levels ---
  - loinc: "2"
    display: "eICU labtypeid 2, drug level (salicylate, ethanol)"
    unit: "mg/dL"
    physiological_min: 0.0
