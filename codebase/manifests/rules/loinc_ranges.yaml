    source: "clinical reference (general clinical knowledge): the wider member of this group is MCV, which peaks near 150 fL in severe megaloblastic anaemia; MPV reaches about 30 fL. 250 covers both, matching the 200 fL bound on the dedicated MCV rules. The previous 500 was more than three times the widest member"

  - loinc: "3"
