    unit: "mOsm/kg H2O"
    unit_aliases: ["mOsm/kg"]
    physiological_min: 0.0
    physiological_max: 2000.0
    source: "clinical reference: bounded by maximal urinary concentrating ability"

  - loinc: "4"
    display: "eICU labtypeid 4, ammonia"
    unit: "mcg/dL"
    unit_aliases: ["ug/dL"]
    physiological_min: 0.0
    physiological_max: 2000.0
    source: "clinical reference (general clinical knowledge): hyperammonaemic coma reaches about 1500 mcg/dL; 2000 covers it. The previous 3000 was twice the cited figure"

  # --- eICU code 7: blood gases, oximetry and ventilator settings ---
  - loinc: "7"
    display: "eICU labtypeid 7, unit-less (pH, total CO2)"
    unit: null
    physiological_min: 0.0
    physiological_max: 60.0
    source: "clinical reference (general clinical knowledge): the two analytes recorded here without a unit are pH, survivable from 6.33 to 7.85 and definitionally within 0-14, and total CO2, survivable to about 50 mmol/L. 60 is the union of the two. The previous 100 bounded neither"

  - loinc: "7"
    display: "eICU labtypeid 7, fraction (FiO2, O2 saturation, oxy/carboxy/methaemoglobin)"
    unit: "%"
    physiological_min: 0.0
    physiological_max: 100.0
    source: "definitional: every analyte reported under this code and unit (FiO2, O2 saturation, oxyhaemoglobin, carboxyhaemoglobin, methaemoglobin) is a fraction of a whole and cannot exceed 100%. The previous bound of 10000 was not a claim about physiology, it was the FiO2 artefact written into the rule; those three rows are now in known_corrupt_values"

  - loinc: "7"
    display: "eICU labtypeid 7, partial pressure (paO2, paCO2)"
    unit: "mm Hg"
    unit_aliases: ["mm[Hg]"]
    physiological_min: 0.0
    physiological_max: 800.0
    source: "clinical reference (general clinical knowledge): breathing 100% oxygen at 1 atm, alveolar pO2 cannot exceed about 670 mmHg once water vapour and carbon dioxide are subtracted from 760; 800 is the same bound the dedicated pO2 rules carry. The previous 1000 exceeded the barometric limit"

  - loinc: "7"
    display: "eICU labtypeid 7, molar concentration (HCO3)"
    unit: "mmol/L"
    physiological_min: 0.0
    physiological_max: 60.0
    source: "clinical reference (general clinical knowledge): survivable bicarbonate spans about 2 to 50 mmol/L, so 60 is the same bound the dedicated bicarbonate rules carry. The previous 500 was ten times the cited ceiling"

  - loinc: "7"
    display: "eICU labtypeid 7, base excess / base deficit"
    unit: "mEq/L"
    physiological_min: -60.0
    physiological_max: 60.0
    source: "clinical reference: base excess is signed by construction; survival reported to -35 mEq/L"

  - loinc: "7"
    display: "eICU labtypeid 7, temperature"
    unit: "&#176;C"
    unit_aliases: ["Cel", "degC"]
    physiological_min: 10.0
    physiological_max: 45.0
    source: "clinical reference (general clinical knowledge): survivable core temperature in Celsius, matching the bound on 8310-5; accidental hypothermia has been survived near 13 degC and hyperthermia is lethal above about 44 degC. The single 99.8 degC row is Fahrenheit mislabelled as Celsius and is in known_corrupt_values, not accommodated by the bound"

  - loinc: "7"
    display: "eICU labtypeid 7, airway pressure (PEEP, pressure support)"
    unit: "cm H2O"
    unit_aliases: ["cmH2O"]
    physiological_min: 0.0
    physiological_max: 200.0
    source: "clinical reference: ventilator circuit pressures do not exceed ~120 cmH2O"

  - loinc: "7"
    display: "eICU labtypeid 7, gas flow (LPM O2)"
    unit: "L/min"
    physiological_min: 0.0
    physiological_max: 200.0
    source: "clinical reference: high-flow nasal oxygen tops out near 60 L/min"

  - loinc: "7"
    display: "eICU labtypeid 7, rate (respiratory rate, ventilator rate)"
    unit: "/min"
    physiological_min: 0.0
    physiological_max: 300.0
    source: "clinical reference: high-frequency modes aside, set and spontaneous rates stay below 150/min"

  - loinc: "7"
