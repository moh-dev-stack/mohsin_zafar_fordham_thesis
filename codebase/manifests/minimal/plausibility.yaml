agent_id: plausibility_agent_v1
dimension: plausibility
resource_types:
  - fhir_resource_type: Observation
    allowed_fields:
      - jsonpath_expression: $.code.coding[*].code
      - jsonpath_expression: $.valueQuantity.value
      - jsonpath_expression: $.valueQuantity.unit
      - jsonpath_expression: $.valueQuantity.code
  - fhir_resource_type: Patient
    allowed_fields:
      - jsonpath_expression: $.gender
      - jsonpath_expression: $.extension[?(@.url=='age-decade')].valueInteger
      - jsonpath_expression: $.extension[?(@.url=='comorbidity-flag')].valueBoolean
note_access:
  enabled: false
rule_references:
  - source: MIMIC-IV reference ranges
    rule_id: adult-lab-ranges
  - source: published clinical normal ranges
    rule_id: vital-sign-bounds
