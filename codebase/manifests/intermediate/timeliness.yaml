# Intermediate-width timeliness manifest.
agent_id: timeliness_agent_v1_intermediate
dimension: timeliness
resource_types:
  - fhir_resource_type: Observation
    allowed_fields:
      - jsonpath_expression: $.id
      - jsonpath_expression: $.effectiveDateTime
      - jsonpath_expression: $.issued
      - jsonpath_expression: $.meta.lastUpdated
      - jsonpath_expression: $.encounter.reference
  - fhir_resource_type: Encounter
    allowed_fields:
      - jsonpath_expression: $.id
      - jsonpath_expression: $.period.start
      - jsonpath_expression: $.period.end
      - jsonpath_expression: $.meta.lastUpdated
note_access:
  enabled: false
rule_references:
  - source: project rules
    rule_id: future-timestamp-invalid
  - source: project rules
    rule_id: result-after-order
  - source: project rules
    rule_id: vitals-charting-gap
  - source: project rules
    rule_id: issued-after-effective
