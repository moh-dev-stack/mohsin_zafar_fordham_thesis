# Intermediate-width consistency manifest.
agent_id: consistency_agent_v1_intermediate
dimension: consistency
resource_types:
  - fhir_resource_type: Encounter
    allowed_fields:
      - jsonpath_expression: $.id
      - jsonpath_expression: $.status
      - jsonpath_expression: $.period.start
      - jsonpath_expression: $.period.end
      - jsonpath_expression: $.class.code
      - jsonpath_expression: $.diagnosis[*].condition.reference
  - fhir_resource_type: Procedure
    allowed_fields:
      - jsonpath_expression: $.encounter.reference
      - jsonpath_expression: $.reasonReference[*].reference
      - jsonpath_expression: $.performedDateTime
      - jsonpath_expression: $.status
  - fhir_resource_type: Condition
    allowed_fields:
      - jsonpath_expression: $.id
      - jsonpath_expression: $.encounter.reference
      - jsonpath_expression: $.onsetDateTime
      - jsonpath_expression: $.clinicalStatus.coding[*].code
  - fhir_resource_type: MedicationStatement
    allowed_fields:
      - jsonpath_expression: $.medicationCodeableConcept.coding[*].code
      - jsonpath_expression: $.subject.reference
      - jsonpath_expression: $.effectiveDateTime
      - jsonpath_expression: $.status
note_access:
  enabled: true
  sections: [medication_reconciliation, allergies, problem_list]
  max_sentences: 40
rule_references:
  - source: project rules
    rule_id: encounter-period-order
  - source: EHRCon
    rule_id: note-structured-entity-match
  - source: project rules
    rule_id: medication-active-vs-discharge
