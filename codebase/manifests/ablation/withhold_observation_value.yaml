# Privilege ablation arm: the minimal plausibility manifest with the measured
# value withheld.
#
# Withheld field:  $.valueQuantity.value   (consumed by dqa.ranges.VALUE_PATH)
#
# This file is a copy of manifests/minimal/plausibility.yaml with exactly one
# allowed_field removed. Everything else -- agent_id, dimension, the Patient
# policy, note_access, rule_references -- is identical on purpose, so the only
# difference between this arm and the control arm is the withheld field.
# dqa.ablation checks that invariant on load and refuses to run if it is broken.
#
# Expected effect: total. dqa.ranges.projected_range_inputs returns None with no
# numeric value in the slice, so the agent returns "uncertain" on every resource,
# flags nothing, and scores F1 = 0. This is the upper bound of the ablation and
# the sanity anchor for the rest of it.
agent_id: plausibility_agent_v1
dimension: plausibility
resource_types:
  - fhir_resource_type: Observation
    allowed_fields:
      - jsonpath_expression: $.code.coding[*].code
      - jsonpath_expression: $.valueQuantity.unit
      - jsonpath_expression: $.valueQuantity.code
  - fhir_resource_type: Patient
    allowed_fields:
      - jsonpath_expression: $.gender
      - jsonpath_expression: $.extension[?(@.url=='age-decade')].valueInteger
      - jsonpath_expression: $.extension[?(@.url=='comorbidity-flag')].valueBoolean
note_access:
  enabled: false
rule_references:
  - source: MIMIC-IV reference ranges
    rule_id: adult-lab-ranges
  - source: published clinical normal ranges
    rule_id: vital-sign-bounds
